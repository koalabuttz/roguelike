[package]
name = "roguelike-gba"
version = "0.5.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Game Boy Advance port of the roguelike dungeon crawler"

[workspace]  # standalone — not part of the parent workspace

[dependencies]
gba = "0.15"
roguelike-core = { path = "../core", default-features = false }

[features]
default = []
dev = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = true
