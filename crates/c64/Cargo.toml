[package]
name = "roguelike-c64"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Commodore 64 port of the roguelike dungeon crawler"

[workspace]  # standalone — not part of the parent workspace

[features]
default = []
dev-console = []  # Menu-driven dev tools via ← key

[dependencies]
roguelike-core = { path = "../core", default-features = false, features = ["c64-overlay"] }

[profile.release]
opt-level = "z"   # size-optimized — see main.rs main()/game_loop() split
lto = true        # link-time optimization enables static stack + zero page allocation
