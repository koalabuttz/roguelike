name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_label: linux
            arch_label: x86_64
            suffix: ''
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os_label: linux
            arch_label: arm64
            suffix: ''
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            os_label: macos
            arch_label: arm64
            suffix: ''
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            os_label: windows
            arch_label: x86_64
            suffix: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binaries
        shell: bash
        run: |
          src=target/${{ matrix.target }}/release
          mkdir -p dist
          cp "${src}/mcp_server${{ matrix.suffix }}" "dist/mcp_server-${{ matrix.os_label }}-${{ matrix.arch_label }}${{ matrix.suffix }}"
          cp "${src}/roguelike${{ matrix.suffix }}" "dist/roguelike-${{ matrix.os_label }}-${{ matrix.arch_label }}${{ matrix.suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os_label }}-${{ matrix.arch_label }}
          path: dist/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
