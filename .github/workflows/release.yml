name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_label: linux
            arch_label: x86_64
            suffix: ''
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os_label: linux
            arch_label: arm64
            suffix: ''
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            os_label: macos
            arch_label: arm64
            suffix: ''
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            os_label: windows
            arch_label: x86_64
            suffix: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binaries
        shell: bash
        run: |
          src=target/${{ matrix.target }}/release
          mkdir -p dist
          cp "${src}/mcp_server${{ matrix.suffix }}" "dist/mcp_server-${{ matrix.os_label }}-${{ matrix.arch_label }}${{ matrix.suffix }}"
          cp "${src}/roguelike${{ matrix.suffix }}" "dist/roguelike-${{ matrix.os_label }}-${{ matrix.arch_label }}${{ matrix.suffix }}"
          cp "${src}/headless${{ matrix.suffix }}" "dist/headless-${{ matrix.os_label }}-${{ matrix.arch_label }}${{ matrix.suffix }}"
          cp "${src}/roguelike-ssh${{ matrix.suffix }}" "dist/roguelike-ssh-${{ matrix.os_label }}-${{ matrix.arch_label }}${{ matrix.suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os_label }}-${{ matrix.arch_label }}
          path: dist/*

  build-c64:
    name: Build (C64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install VICE tools (c1541)
        run: sudo apt-get update && sudo apt-get install -y vice
      - name: Build C64 PRG via rust-mos Docker
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e CARGO_HOME=/tmp/cargo \
            -e PATH=/usr/local/rust-mos/bin:/usr/local/bin:/usr/bin:/bin \
            -v "${{ github.workspace }}:/repo" \
            -w /repo/crates/c64 \
            ghcr.io/koalabuttz/rust-mos:ac2fb2277-4537158-215f25be4 \
            cargo build --release
      - name: Create .d64 disk image
        run: |
          mkdir -p dist
          PRG=crates/c64/target/mos-c64-none/release/roguelike-c64
          cp "$PRG" dist/roguelike-c64.prg
          c1541 -format "roguelike,rg" d64 dist/roguelike-c64.d64 \
            -write "$PRG" "roguelike"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-c64
          path: dist/*

  release:
    name: Create Release
    needs: [build, build-c64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts

      - name: Generate checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Binaries
            | Binary | Description |
            |--------|-------------|
            | `roguelike-*` | Terminal game |
            | `roguelike-ssh-*` | SSH server for multiplayer |
            | `mcp_server-*` | MCP server for LLM play |
            | `headless-*` | Automated playtesting runner |
            | `roguelike-c64.prg` | Commodore 64 PRG (VICE / real hardware) |
            | `roguelike-c64.d64` | Commodore 64 disk image (VICE / 1541) |

            Verify: `sha256sum -c SHA256SUMS.txt`
          files: artifacts/*
