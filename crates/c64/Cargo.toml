[package]
name = "roguelike-c64"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Commodore 64 port of the roguelike dungeon crawler (rust-mos proof of concept)"

# No dependencies — pure no_std, no alloc.
# Hardware access via raw pointers, PRNG is hand-rolled.

[profile.release]
opt-level = "s"   # optimize for size — every byte matters on C64
lto = true        # link-time optimization enables static stack + zero page allocation
