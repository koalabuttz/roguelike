[package]
name = "roguelike-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["dev-tools", "gamepad"]
dev-tools = ["roguelike-core/dev-tools", "roguelike-tui/dev-tools"]
gamepad = ["gilrs"]
raw-usb = ["gamepad", "rusb"]

[dependencies]
roguelike-core = { path = "../core" }
roguelike-saves = { path = "../saves" }
roguelike-tui = { path = "../tui" }
crossterm = "0.28"
serde_json = { workspace = true }
gilrs = { version = "0.11", optional = true }
rusb = { version = "0.9", optional = true }

[[example]]
name = "usb_hid_test"
required-features = ["raw-usb"]

[[bin]]
name = "roguelike"
path = "src/main.rs"
