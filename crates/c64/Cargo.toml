[package]
name = "roguelike-c64"
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Commodore 64 port of the roguelike dungeon crawler"

[workspace]  # standalone — not part of the parent workspace

[dependencies]
roguelike-core = { path = "../core", default-features = false }

[profile.release]
opt-level = "z"   # optimize aggressively for size — every byte matters on C64
lto = true        # link-time optimization enables static stack + zero page allocation
