[workspace]
resolver = "2"
members = ["crates/core", "crates/saves", "crates/tui", "crates/terminal", "crates/mcp", "crates/ssh"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[patch.crates-io]
libudev-sys = { path = "crates/libudev-sys-dlopen" }
