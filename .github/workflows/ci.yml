name: CI

on:
  push:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/**'

env:
  CARGO_TERM_COLOR: always
  # Pinned to the rust-mos fork's rebase point. Local development uses a
  # custom rustc fork (for MOS 6502 / SM83 targets) so we pin CI to match
  # and avoid clippy-lint drift between local and CI. Bump in lockstep when
  # the local fork is rebased onto a newer upstream Rust release.
  RUST_TOOLCHAIN: "1.93.1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo clippy --workspace --features raw-usb -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    needs: lint
    strategy:
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: macOS ARM64
            os: macos-latest
          - name: Windows x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: Test with raw-usb feature (Linux only)
        if: runner.os == 'Linux'
        run: cargo test --workspace --features raw-usb

  bench:
    name: Benchmark
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/criterion
          key: criterion-${{ hashFiles('crates/core/benches/**') }}
          restore-keys: criterion-
      - run: cargo bench -p roguelike-core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: criterion-report
          path: target/criterion
          retention-days: 30

  audit:
    name: Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked && cargo audit

  c64-memory:
    name: C64 memory budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build linker map with pinned Rust-MOS
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e CARGO_HOME=/tmp/cargo \
            -e PATH=/usr/local/rust-mos/bin:/usr/local/bin:/usr/bin:/bin \
            -v "${{ github.workspace }}:/repo" \
            -w /repo/crates/c64 \
            ghcr.io/koalabuttz/rust-mos:ac2fb2277-4537158-4aaa40e16 \
            env RUSTFLAGS="-C link-arg=-Tlink.ld -C link-arg=-Wl,--no-check-sections -C link-arg=-Wl,--allow-multiple-definition -C link-arg=-Wl,-Map,map.txt -Z mir-opt-level=1" \
            cargo build --release
      - name: Enforce floors and report deltas
        working-directory: crates/c64
        run: |
          python3 memmap.py map.txt \
            --budget memory-budget.json \
            --json memory-report.json | tee memory-report.txt
          python3 analyze_map.py map.txt > symbol-report.txt
          {
            echo "### C64 memory report"
            echo '```text'
            cat memory-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c64-memory-report
          path: |
            crates/c64/map.txt
            crates/c64/memory-report.json
            crates/c64/memory-report.txt
            crates/c64/symbol-report.txt
          retention-days: 30
