[package]
name = "roguelike-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
roguelike-core = { path = "../core" }
roguelike-saves = { path = "../saves" }
roguelike-tui = { path = "../tui", default-features = false, features = [] }
russh = "0.49"
russh-keys = "0.49"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
argon2 = "0.5"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
dirs = "6"
crossterm = "0.28"
rand = { workspace = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "roguelike-ssh"
path = "src/main.rs"
